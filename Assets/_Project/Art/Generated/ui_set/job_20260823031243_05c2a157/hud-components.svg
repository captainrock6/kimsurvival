<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="5" dy="7" stdDeviation="3" flood-color="#0a131a" flood-opacity=".35"/></filter>
    <style>.ink{stroke:#18232f;stroke-width:4;stroke-linejoin:round}.stitch{fill:none;stroke:#8b5b2f;stroke-width:2;stroke-dasharray:7 6}.safe{fill:#fff7e1;fill-opacity:.10;stroke:#fff7e1;stroke-opacity:.70;stroke-width:2;stroke-dasharray:6 5}.focus{fill:none;stroke:#f6c249;stroke-width:7}</style>
    <symbol id="panel-dark" viewBox="0 0 560 260"><rect x="4" y="4" width="552" height="252" rx="18" fill="#233546" class="ink" filter="url(#shadow)"/><rect x="14" y="14" width="532" height="232" rx="12" class="stitch"/></symbol>
    <symbol id="panel-light" viewBox="0 0 560 260"><rect x="4" y="4" width="552" height="252" rx="18" fill="#f6dea9" class="ink" filter="url(#shadow)"/><rect x="14" y="14" width="532" height="232" rx="12" class="stitch"/></symbol>
    <symbol id="button-default" viewBox="0 0 520 112"><rect x="4" y="4" width="512" height="104" rx="14" fill="#eed29e" class="ink"/><rect x="106" y="24" width="382" height="64" rx="7" class="safe"/></symbol>
    <symbol id="button-focus" viewBox="0 0 540 112"><path d="M4 56 22 42v28z" fill="#f6c249"/><rect x="24" y="4" width="512" height="104" rx="14" fill="#eed29e" class="ink focus"/><rect x="126" y="24" width="382" height="64" rx="7" class="safe"/></symbol>
    <symbol id="button-disabled" viewBox="0 0 520 112"><rect x="4" y="4" width="512" height="104" rx="14" fill="#68746f" class="ink"/><path d="M22 22 90 90M90 22 22 90" class="ink" fill="none" stroke-width="7"/><rect x="106" y="24" width="382" height="64" rx="7" class="safe"/></symbol>
    <symbol id="slot" viewBox="0 0 152 152"><rect x="4" y="4" width="144" height="144" rx="20" fill="#f6dea9" class="ink"/></symbol>
    <symbol id="slot-focused" viewBox="0 0 152 152"><rect x="4" y="4" width="144" height="144" rx="20" fill="#f6dea9" class="ink focus"/></symbol>
    <symbol id="slot-locked" viewBox="0 0 152 152"><rect x="4" y="4" width="144" height="144" rx="20" fill="#68746f" class="ink"/><path d="M30 30 122 122M122 30 30 122" class="ink" fill="none" stroke-width="8"/></symbol>
  </defs>
  <g id="nine-slice-panels"><use href="#panel-dark" x="48" y="48" width="560" height="260"/><use href="#panel-light" x="656" y="48" width="560" height="260"/></g>
  <g id="action-states"><use href="#button-default" x="48" y="360" width="520" height="112"/><use href="#button-focus" x="28" y="508" width="540" height="112"/><use href="#button-disabled" x="48" y="656" width="520" height="112"/></g>
  <g id="inventory-states"><use href="#slot" x="656" y="700" width="152" height="152"/><use href="#slot-focused" x="844" y="700" width="152" height="152"/><use href="#slot-locked" x="1032" y="700" width="152" height="152"/></g>
  <g id="tmp-safe-area-samples"><rect x="96" y="956" width="760" height="74" rx="8" class="safe"/><rect x="1324" y="1118" width="428" height="84" rx="8" class="safe"/></g>
</svg>