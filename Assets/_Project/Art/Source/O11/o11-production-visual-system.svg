  <rect x="655" y="248" width="640" height="475" class="safe"/>
  <text x="670" y="278" class="note">CENTRAL PLAY BAND — NO PERSISTENT PANEL</text>

  <!-- Compact bottom-left 4–10 slot bag: 44px+ focus, shape is not color-only. -->
  <g transform="translate(34 814)">
    <rect width="520" height="248" rx="10" class="ink"/>
    <rect x="22" y="16" width="476" height="38" class="safe"/>
    <text x="30" y="14" class="note">TMP BAG TITLE SAFE</text>
    <g transform="translate(20 64)">
      <g class="fine">
        <rect width="88" height="88" rx="7"/><rect x="96" width="88" height="88" rx="7"/>
        <rect x="192" width="88" height="88" rx="7"/><rect x="288" width="88" height="88" rx="7"/>
        <rect x="384" width="88" height="88" rx="7"/>
        <rect y="96" width="88" height="88" rx="7"/><rect x="96" y="96" width="88" height="88" rx="7"/>
        <rect x="192" y="96" width="88" height="88" rx="7"/><rect x="288" y="96" width="88" height="88" rx="7"/>
        <rect x="384" y="96" width="88" height="88" rx="7"/>
      </g>
      <rect x="96" width="88" height="88" rx="7" class="focus"/>
      <g fill="#1C858A">
        <path d="M25 20h38v30H25z"/><circle cx="140" cy="34" r="18"/><path d="M220 50l16-32 16 32z"/>
        <path d="M314 20h36l-8 34h-20z"/><path d="M412 22l20 32 20-32z"/>
      </g>
      <g fill="url(#cross)" opacity=".9">
        <rect y="96" width="88" height="88" rx="7"/><rect x="96" y="96" width="88" height="88" rx="7"/>
        <rect x="192" y="96" width="88" height="88" rx="7"/><rect x="288" y="96" width="88" height="88" rx="7"/>
        <rect x="384" y="96" width="88" height="88" rx="7"/>
      </g>
    </g>
  </g>

  <!-- Context panel family: same 9-slice grammar for camp/search/facility/escape. -->
  <g transform="translate(1460 235)">
    <rect width="426" height="520" rx="12" class="ink"/>
    <path d="M18 18h54M18 18v54M408 18h-54M408 18v54M18 502h54M18 502v-54M408 502h-54M408 502v-54" stroke="#F59B2E" stroke-width="5" fill="none"/>
    <rect x="32" y="34" width="362" height="54" class="safe"/>
    <rect x="32" y="104" width="362" height="180" class="safe"/>
    <rect x="32" y="304" width="171" height="64" rx="8" class="teal"/>
    <rect x="223" y="304" width="171" height="64" rx="8" class="fine"/>
    <rect x="32" y="388" width="171" height="64" rx="8" class="fine"/>
    <rect x="223" y="388" width="171" height="64" rx="8" class="fine"/>
    <text x="40" y="29" class="note">TMP TITLE</text>
    <text x="40" y="100" class="note">TMP BODY / LIST SAFE</text>
    <text x="40" y="296" class="note">44+ FOCUS RECTS</text>
  </g>

  <!-- Seven region grammar: color field + landmark + searchable silhouette + pattern. -->
  <g transform="translate(584 824)">
    <g transform="translate(0 0)"><rect width="164" height="102" rx="8" fill="#E1B05C"/><path d="M12 78q40-55 80 0t60 0" class="line"/><path d="M118 78l14-42 14 42z" class="ink"/><circle cx="38" cy="65" r="13" class="teal"/></g>
    <g transform="translate(174 0)"><rect width="164" height="102" rx="8" fill="#4D8038"/><path d="M0 42q35-40 70 0t70 0t50 0v60H0z" class="ink" opacity=".5"/><path d="M70 82l10-42 10 42z" class="amber"/><rect width="164" height="102" fill="url(#cross)" opacity=".18"/></g>
    <g transform="translate(348 0)"><rect width="164" height="102" rx="8" fill="#10A8BF"/><rect y="58" width="164" height="44" fill="url(#wave)"/><path d="M68 84l14-34 14 34z" class="amber"/></g>
    <g transform="translate(522 0)"><rect width="164" height="102" rx="8" fill="#756D5E"/><path d="M0 84L42 28l34 36 30-22 58 42z" class="ink"/><path d="M120 58l14 26h-28z" class="amber"/></g>
    <g transform="translate(0 112)"><rect width="164" height="102" rx="8" fill="#293D3B"/><path d="M20 102q10-94 72-94t60 94z" class="ink"/><path d="M68 84h32l-16-30z" class="teal"/></g>
    <g transform="translate(174 112)"><rect width="164" height="102" rx="8" fill="#806B45"/><path d="M12 72l30-38 106 28-18 26H26z" class="ink"/><rect x="72" y="48" width="38" height="34" class="amber"/></g>
    <g transform="translate(348 112)"><rect width="164" height="102" rx="8" fill="#666B5C"/><path d="M80 14v70M50 34h60M58 34l-18 48M102 34l22 48" class="line"/><path d="M126 28l14 14-14 14 14 14" stroke="#F59B2E" stroke-width="7" fill="none"/></g>
    <text x="0" y="-10" class="note">7 REGION FIELDS · LANDMARK + NODE SILHOUETTE · NON-COLOR HAZARD PATTERN</text>
  </g>

  <!-- Animation handoff: eight named runtime state slots, fixed bottom pivot. -->
  <g transform="translate(1120 824)">
    <path d="M0 208h728" stroke="#F59B2E" stroke-width="4"/>
    <g fill="#091413">
      <path d="M28 56h42v112H28z"/><path d="M120 54h42v114h-42z"/>
      <path d="M210 82h58v86h-58z"/><path d="M310 68h48v100h-48z"/>
      <path d="M404 40h42v128h-42z"/><path d="M486 100h86v40h-86z"/>
      <path d="M612 72h52v96h-52z"/><path d="M690 122h52v46h-52z"/>
    </g>
    <g fill="#F59B2E">
      <circle cx="49" cy="42" r="18"/><circle cx="141" cy="40" r="18"/><circle cx="239" cy="67" r="18"/>
      <circle cx="334" cy="54" r="18"/><circle cx="425" cy="26" r="18"/><circle cx="530" cy="86" r="18"/>
      <circle cx="638" cy="57" r="18"/><circle cx="716" cy="108" r="18"/>
    </g>
    <g fill="#1C858A"><circle cx="49" cy="208" r="6"/><circle cx="141" cy="208" r="6"/><circle cx="239" cy="208" r="6"/><circle cx="334" cy="208" r="6"/><circle cx="425" cy="208" r="6"/><circle cx="530" cy="208" r="6"/><circle cx="638" cy="208" r="6"/><circle cx="716" cy="208" r="6"/></g>
    <text x="0" y="232" class="note">FIXED FOOT PIVOT · 8 RUNTIME STATES</text>
  </g>

  <text x="34" y="1068" class="note">O11 EDITABLE REVIEW SOURCE · ADOPTED GRAMMAR SOURCE job_20260828122852_c9ccf2aa · NEW ART STATUS REVIEW</text>
</svg>
