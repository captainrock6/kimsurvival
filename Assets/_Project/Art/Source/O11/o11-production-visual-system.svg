<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .ink{fill:#091413}.paper{fill:#E8D6A8}.amber{fill:#F59B2E}.teal{fill:#1C858A}
      .line{fill:none;stroke:#091413;stroke-width:8;stroke-linejoin:round}
      .fine{fill:none;stroke:#E8D6A8;stroke-width:3;stroke-linejoin:round}
      .focus{fill:none;stroke:#1C858A;stroke-width:6;stroke-dasharray:16 8}
      .safe{fill:none;stroke:#E8D6A8;stroke-width:2;stroke-dasharray:8 8;opacity:.62}
      .note{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#E8D6A8}
      .small{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#091413}
    </style>
    <pattern id="cross" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="16" fill="#091413" opacity=".38"/>
    </pattern>
    <pattern id="wave" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q8 2 16 10 T32 10" fill="none" stroke="#E8D6A8" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#45AEDA"/>
  <rect y="430" width="1920" height="375" fill="#DAB66C"/>
  <path d="M0 500 Q260 430 520 500 T1040 495 T1560 500 T2080 480 L1920 650 L0 650Z" fill="#147C82" opacity=".72"/>
  <path d="M0 650 Q240 610 420 660 T820 650 T1250 645 T1660 650 T2040 630 L1920 805 L0 805Z" fill="#F1D791"/>
  <path d="M250 595 l80-165 55 165z M335 595 l115-230 75 230z M1530 605 l90-195 75 195z" fill="#2D6C4A" opacity=".76"/>

  <!-- Thin persistent HUD: all content is a live TMP slot. -->
  <rect x="34" y="20" width="1852" height="74" rx="12" class="ink"/>
  <rect x="64" y="39" width="910" height="36" class="safe"/>
  <rect x="1050" y="39" width="806" height="36" class="safe"/>
  <text x="72" y="34" class="note">TMP STATUS SAFE</text>
  <text x="1058" y="34" class="note">TMP RESOURCE SAFE</text>
  <circle cx="76" cy="57" r="14" class="amber"/><path d="M70 57h12M76 51v12" class="line" stroke-width="4"/>

  <!-- Narration / compact contextual message lane. -->
  <rect x="710" y="116" width="808" height="76" rx="10" class="ink" opacity=".92"/>
  <rect x="742" y="135" width="744" height="38" class="safe"/>
  <text x="750" y="130" class="note">TMP NARRATION / PROMPT SAFE</text>

  <!-- Mr. Kim keeps the central play band clear. -->
  <g transform="translate(865 390)">
    <circle cx="0" cy="0" r="42" fill="#F0B37E" class="line"/>
    <path d="M-45 50 Q0 15 55 54 L44 186 Q0 210 -52 182Z" class="amber line"/>
    <path d="M-45 65 L-82 142 M50 68 L92 130 M-28 187 L-40 290 M28 187 L48 290" class="line"/>
